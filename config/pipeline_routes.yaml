version: 2
current_product_phase: PHASE_1_LOCAL_VIDEO_FACTORY
phase1_local:
  orchestrator: local_factory
  control_entrypoint: scripts/factory.py phase1
  render_entrypoint: generate_video.py
  requires_openclaw: false
  requires_feishu: false
  requires_cron: false
  mandatory_result:
  - local_mp4
  - quality_report
  - review_package
  - human_review
  optional_finalizer:
  - jianying-editor-skill
  input_modes:
  - topic
  - local_reference
  - authorized_public_research
# The OpenClaw routes below are retained for future Phase 2. They are not the
# current Phase 1 orchestrator and must not be executed before Phase 1 passes.
orchestrator: openclaw
orchestrator_scope: PHASE_2_FEISHU_AUTOMATION_ONLY
code_maintainer: codex
routes:
  topic_request:
    skills:
    - topic-intelligence
    - script-storyboard-director
    output:
    - candidate_topics.json
    - topic_cards.md
    delivery_skill: feishu-video-factory-operator
  user_selected_topic:
    skills:
    - script-storyboard-director
    - media-asset-curator
    - comfyui-gpu-renderer
    - pink-pig-mascot-director
    - remotion-layout-engine
    - audio-subtitle-engine
    - video-quality-gate
    finalizer:
    - jianying-editor-skill
  selection_timeout:
    preconditions:
      minimum_score: 80
      sources_verified: true
      duplicate_check_passed: true
    then: user_selected_topic
  shared_reference_video:
    skills:
    - reference-video-analyzer
    - reference-video-recreator
    - script-storyboard-director
    - media-asset-curator
    - comfyui-gpu-renderer
    - pink-pig-mascot-director
    - remotion-layout-engine
    - audio-subtitle-engine
    - video-quality-gate
    finalizer:
    - jianying-editor-skill
    ingress_skill: feishu-video-factory-operator
  remotion_template_change:
    skills:
    - codex-template-maintainer
    - remotion-layout-engine
  deterministic_visuals:
    examples:
    - 协议帧
    - 代码
    - 寄存器
    - 电路
    - 时序图
    - 流程图
    engine: remotion_svg_html
    never_use_text_to_image: true
  creative_visuals:
    engine_priority:
    - local_asset_library
    - licensed_stock
    - comfyui_image
    - comfyui_short_video
    - deterministic_fallback
  mascot_system:
    repository: https://github.com/Jovifei/ian-fenzhu-illustrations
    activation_policy: explicit_user_opt_in
    required_for: []
    when_user_requests:
    - use_jovi_original_asset_pack_only
    - require_receipt_bound_ownership
    fallback: disable_mascot_and_fail_closed_if_original_assets_are_missing
  delivery:
    skills:
    - video-quality-gate
    - feishu-video-factory-operator
    artifacts:
    - topic_card
    - cover
    - final_video
    - publish_info
    - quality_report
services:
  comfyui:
    phase: PHASE_3_OPTIONAL
    url: http://127.0.0.1:8188
    timeout_seconds: 900
  capcut_mate:
    phase: FUTURE_ISOLATED_ADAPTER
    url: http://127.0.0.1:30000
    timeout_seconds: 120
  remotion:
    phase: PHASE_1
    mode: local_cli
  codex:
    mode: delegated_only
  feishu:
    phase: PHASE_2_ONLY
    provider: larksuite_cli
    inbound: openclaw_channel
    outbound: lark_cli_im
    event_fallback: lark_cli_event
