version: 1
canonical_source: https://github.com/Jovifei/ian-fenzhu-illustrations
activation_policy: explicit_user_opt_in
default_mode: off
original_asset_policy:
  required_when_enabled: true
  ownership: jovi_original_only
  verification: receipt_bound_asset_pack
  missing_asset_action: fail_closed_request_original_asset_path
  forbidden_substitutes:
  - repository_created_png_or_svg
  - ai_generated_mascot
  - upstream_style_sample
  - upstream_prompt_only_repository
character:
  name: 小粉飞猪
  visual:
  - 低饱和雾粉色实心身体
  - 小圆鼻和点状眼睛
  - 小耳朵、小翅膀、细小四肢
  - 手绘略抖轮廓
  personality:
  - 认真但不端着
  - 轻盈但不轻浮
  - 有点笨拙但可靠
  - 冷幽默
  - 先观察再拆解再改装
  meaning: 普通的东西经过认真改装，也能长出自己的翅膀。
exposure_policy:
  brand_signature_video_ratio: 1.0
  active_character_video_ratio_target:
  - 0.5
  - 0.7
  pig_led_special_ratio_target:
  - 0.05
  - 0.12
  active_appearances_per_video:
  - 1
  - 3
  active_screen_time_seconds:
  - 2
  - 8
modes:
- opening_corner_mark
- knowledge_point_worker
- warning_or_question_reaction
- transition_bumper
- ending_signature
- pig_lab_lead
preferred_actions:
- 拆
- 装
- 修
- 拧
- 搬
- 拉
- 推
- 接
- 测
- 焊
- 标记
- 盖章
- 搭桥
- 搬运数据包
rules:
- 不得默认启用；只有 Jovi 在当前视频 brief 中明确要求时才允许使用个人 IP。
- 启用时只能使用 Jovi 提供并核验归属的原始粉色飞猪素材；没有原始资产路径或 receipt 时必须失败关闭。
- 禁止用本仓库自制 `assets/pink_pig/*`、`src/factory/assets/mascot/*`、AI 临时生成图或上游样例图替代 Jovi 原始 IP。
- 未收到粉色飞猪提示时，视频不得生成粉色飞猪、签名或角色构图。
- 角色必须参与观点的核心动作，不能只是飘在角落。
- 技术信息密集时降级为角标或结尾签名。
- 不得遮挡代码、报文、图表、字幕和关键操作。
- 不做粉红佩奇式儿童角色，不使用高饱和粉、不使用闪亮大眼睛。
- 不要每条都重复飞机、云朵、传送带和同一构图。
- 角色资产失败不得阻塞主视频输出。
