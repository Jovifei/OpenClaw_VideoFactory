version: 2.7
product_phase_alignment:
  authority: docs/PRODUCT_PHASES.md
  effective_date: '2026-08-14'
  current_product_phase: PHASE_1_LOCAL_VIDEO_FACTORY
  rule: Phase 1 local Codex video creation is the current delivery priority. Historical P0 Feishu work is retained as Phase 2 safety evidence and must not block Phase 1.
  phase_1_inputs:
  - Jovi-provided topic
  - Jovi-provided local reference video for theme/structure analysis
  - explicitly authorized public-topic research
  phase_1_excludes:
  - Feishu
  - OpenClaw runtime
  - lark-cli
  - Cron
  - automatic publication
  phase_2_scope: historical P0 Feishu safety, candidate cards, user selection, qualified fallback, controlled delivery, and Cron
definition_of_done:
- code_committed
- tests_passed
- run_evidence_saved
- rollback_documented
- no_secret_in_repo
phases:
  P0:
    name: Historical Feishu safety track retained for Phase 2
    status: deferred_to_phase_2
    codex_plugin_status: deferred_optional_not_blocking
    tasks:
    - id: P0-01
      title: Run package integrity and read-only machine preflight
      depends_on: []
      output: reports/package_check.*, reports/machine_inventory.*
      acceptance: Root layout, GPU, disks, binaries, OpenClaw, Codex, NVENC, ComfyUI
        and Jianying candidates are recorded.
    - id: P0-02
      title: Capture live OpenClaw schema and redacted state
      depends_on:
      - P0-01
      output: reports/openclaw_state/
      acceptance: Schema, validation, doctor, gateway, skills, channels, cron and
        security audit captured.
    - id: P0-03
      title: Resolve true decision gaps and pin versions
      depends_on:
      - P0-02
      output: reports/DECISION_GAPS.md, config/versions.lock.yaml
      acceptance: All blockers explicit; dependencies pinned.
    - id: P0-04
      title: Apply minimal schema-validated OpenClaw patch
      depends_on:
      - P0-03
      output: reports/openclaw_state/applied_patch.json5 and rollback
      acceptance: Workspace, timezone, auto exec and Gateway health verified.
    - id: P0-05
      title: Verify Direct Codex CLI read and workspace-write execution
      depends_on:
      - P0-04
      output: reports/CODEX_CLI_SMOKE.json, reports/CODEX_CLI_SMOKE.md
      acceptance: Read smoke exits 0 with no workspace change; write smoke exits
        0 and changes only reports/codex_cli_smoke.txt. OpenClaw Codex Plugin OAuth
        is not used.
    - id: P0-06
      title: Configure official OpenClaw Feishu channel with allowlists
      depends_on:
      - P0-04
      output: reports/FEISHU_CHANNEL_TEST.json
      acceptance: Approved text/file input works and unauthorized sources are blocked.
    - id: P0-07
      title: Install and pin official larksuite/cli
      depends_on:
      - P0-03
      output: reports/LARK_CLI_INSTALL.md
      acceptance: CLI and lark-shared/im/event skills available.
    - id: P0-08
      title: Configure lark-cli bot identity and permissions
      depends_on:
      - P0-06
      - P0-07
      output: reports/FEISHU_AUTH.md
      acceptance: No plaintext secrets; target allowlist verified.
    - id: P0-09
      title: Run bidirectional Feishu smoke tests
      depends_on:
      - P0-08
      output: reports/FEISHU_SINGLE_CONSUMER_TEST.json, reports/FEISHU_INGRESS_TEST.json,
        reports/FEISHU_EGRESS_TEST.json
      acceptance: Generated TXT/PNG/MP4 fixtures enter once through video-factory,
        safe receipt/hash/quarantine passes, and Markdown/PNG/TXT/MP4 egress plus
        idempotency pass.
    - id: P0-10
      title: Verify Skill visibility
      depends_on:
      - P0-04
      - P0-07
      output: reports/SKILL_VISIBILITY.json
      acceptance: 14 local and required official lark skills visible.
    - id: P0-11
      title: Pass P0 gate
      depends_on:
      - P0-05
      - P0-09
      - P0-10
      output: reports/gates/P0_READY.json
      acceptance: P0 gate exits 0 with current existing-agent/binding regression
        evidence and no VideoFactory production Cron. OpenClaw Default Runtime is
        allowed.
  P1:
    name: Phase 1 local Codex video factory in small verified increments
    tasks:
    - id: P1-00
      title: Define local topic, local reference-video and authorized-public-research input contracts
      implementation_status: topic_mode_complete_other_modes_fail_closed
      depends_on: []
      output: topic_brief, reference_report (when applicable), source boundary and local input digest
      acceptance: Reference inputs remain read-only; generated script and visuals are original; no Feishu, OpenClaw, lark-cli, Cron, downloader, account or publication action occurs.
    - id: P1-A
      title: Implement local state/event/artifact store and CLI only
      implementation_status: local_topic_control_complete
      depends_on:
      - P1-00
      output: src/factory/db.py, src/factory/phase1_cli.py, scripts/factory.py
      acceptance: Local input digest idempotency, cancel, and restart recovery tests pass; no video is generated.
    - id: P1-B
      title: Render one fixed JSON fixture to a 10-second MP4
      depends_on:
      - P1-A
      output: one 1080x1920 static MP4
      acceptance: File is decodable; no TTS, captions, network research, or extra template.
    - id: P1-C
      title: Add TTS and captions to the fixed fixture
      implementation_status: local_windows_sapi_complete_for_modbus
      depends_on:
      - P1-B
      output: voice.wav, captions.srt, MP4
      acceptance: Audio and monotonic safe captions pass without adding a template.
    - id: P1-D1
      title: Add protocol-frame template
      depends_on: [P1-C]
      output: remotion/src/templates/protocol-frame
      acceptance: Template renders and passes media checks.
    - id: P1-D2
      title: Add code-explainer template
      depends_on: [P1-D1]
      output: remotion/src/templates/code-explainer
      acceptance: Template renders and passes media checks.
    - id: P1-D3
      title: Add flow-diagram template
      depends_on: [P1-D2]
      output: remotion/src/templates/flow-diagram
      acceptance: Template renders and passes media checks.
    - id: P1-D4
      title: Add engineering-case template
      depends_on: [P1-D3]
      output: remotion/src/templates/engineering-case
      acceptance: Template renders and passes media checks.
    - id: P1-E
      title: Add deterministic Pink Pig PNG/SVG assets
      depends_on: [P1-D4]
      output: src/mascot and deterministic asset pack
      acceptance: Placement, occlusion, and static fallback checks pass.
    - id: P1-F1
      title: Complete Modbus fixture
      implementation_status: candidate_ready_for_human_review
      depends_on: [P1-E]
      output: FIX-001 delivery package
      acceptance: Clean run, rerun, cancel, retry, and CPU/NVENC fallback pass.
    - id: P1-F2
      title: Complete Flash/watchdog fixture
      depends_on: [P1-F1]
      output: FIX-002 delivery package
      acceptance: Clean run, rerun, cancel, retry, and CPU/NVENC fallback pass.
    - id: P1-F3
      title: Complete FreeRTOS fixture
      depends_on: [P1-F2]
      output: FIX-003 delivery package
      acceptance: Clean run, rerun, cancel, retry, and CPU/NVENC fallback pass.
    - id: P1-F4
      title: Complete user-provided local reference-video topic fixture
      depends_on: [P1-F3]
      output: reference report, original script/storyboard and local review package
      acceptance: A read-only reference video yields only theme/structure/general-expression analysis and a new original MP4 without reused audio, watermark, continuous source footage or full source copy.
    - id: P1-G
      title: Add local review package and human acceptance last
      implementation_status: first_fixture_package_complete_remaining_fixtures_pending
      depends_on: [P1-F4]
      output: cover, final_master MP4, captions, render/quality reports and local review checklist
      acceptance: All fixtures produce reviewable local packages; no Feishu delivery is attempted.
    - id: P1-99
      title: Pass Phase 1 local-video-factory acceptance gate
      depends_on:
      - P1-G
      output: reports/gates/PHASE_1_LOCAL_VIDEO_FACTORY_READY.json
      acceptance: Phase 1 gate exits 0 with evidence; this does not start Feishu automation.
  P1.5:
    name: Video Use Adapter Pilot
    optional: true
    depends_on:
    - P1
    tasks:
    - id: P1.5-01
      title: License and source audit of browser-use/video-use
      acceptance: MIT notice and pinned commit recorded; no installer executed.
    - id: P1.5-02
      title: Extract EDL, packed transcript and cut-boundary contracts
      acceptance: Contracts are documented independently of ElevenLabs.
    - id: P1.5-03
      title: Implement faster-whisper CUDA transcription adapter
      acceptance: Word timestamps and cache work on Windows.
    - id: P1.5-04
      title: Implement Chinese caption chunking and safe zones
      acceptance: Chinese captions do not use English uppercase/two-word assumptions.
    - id: P1.5-05
      title: Implement 30 FPS NVENC render with CPU fallback
      acceptance: Both paths produce valid portrait MP4.
    - id: P1.5-06
      title: Run three-source-footage pilot
      fixtures:
      - talking_head
      - screen_recording
      - multi_take
      acceptance: No word cuts, no audio pops, max 3 self-review passes, original media unchanged.
  P2:
    name: Phase 2 Feishu topic recommendation, controlled delivery and timeout fallback
    tasks:
    - id: P2-00
      title: Complete historical P0 Feishu safety and controlled egress prerequisites
      depends_on:
      - P1-99
      output: Phase 2 Feishu safety evidence and rollback records
      acceptance: Allowlist, single consumer, isolated receipt/MIME/SHA, explicit two-message intent, controlled idempotent egress and recovery evidence pass without production Cron.
    - id: P2-01
      title: Implement source adapters and semantic history index
      depends_on:
      - P2-00
      output: src/topic_sources/
      acceptance: Configured user directories can be indexed without reading outside
        allowlist.
    - id: P2-02
      title: Implement topic generation, scoring and deduplication
      depends_on:
      - P2-01
      output: candidate_topics.json
      acceptance: At least 10 raw candidates and 3-5 valid cards.
    - id: P2-03
      title: Implement selection parser and commands
      depends_on:
      - P2-02
      output: OpenClaw interaction handlers
      acceptance: Rank, title and natural-language modifications are recognized.
    - id: P2-04
      title: Implement 12:00 auto-selection, immediate production, cancellation and
        Cron
      depends_on:
      - P2-03
      output: cron jobs and state transitions
      acceptance: Low score pauses; qualified highest score produces immediately;
        cancellation before heavy work; retries idempotent.
    - id: P2-05
      title: Pass P2 gate and run seven-day reliability trial
      depends_on:
      - P2-04
      output: reports/P2_TEST_RESULTS.json and reports/SEVEN_DAY_TRIAL.json
      acceptance: Completion >=90%, no duplicate jobs, manual effort measured.
    - id: P2-06
      title: Support mascot-aware topic cards and rendering rules for embedded and
        AI-hot-topic columns
      depends_on:
      - P2-02
      - P1-E
      output: topic card extensions and render metadata
      acceptance: Topic cards can request pig usage mode; embedded and AI-hot-topic
        outputs both support consistent mascot placement.
    - id: P2-99
      title: Pass P2 acceptance gate
      depends_on:
      - P2-06
      output: reports/gates/P2_READY.json
      acceptance: p2 gate exits 0 with evidence.
  P3:
    name: RTX 4070 SUPER integration
    tasks:
    - id: P3-01
      title: Implement serialized GPU queue and telemetry
      depends_on:
      - P2-05
      output: src/gpu_queue/
      acceptance: Whisper and ComfyUI heavy jobs do not overlap.
    - id: P3-02
      title: Enable faster-whisper CUDA
      depends_on:
      - P3-01
      output: GPU subtitle benchmark
      acceptance: CUDA path works and CPU fallback is tested.
    - id: P3-03
      title: Curate ComfyUI whitelist workflows
      depends_on:
      - P3-01
      output: comfyui/workflows/approved/
      acceptance: No automatic node/model downloads; hashes are recorded.
    - id: P3-04
      title: Implement OOM and timeout fallbacks
      depends_on:
      - P3-03
      output: reports/GPU_FAULT_INJECTION.md
      acceptance: Deliberate OOM falls back without losing job.
    - id: P3-05
      title: Integrate Real-ESRGAN and NVENC metrics
      depends_on:
      - P3-03
      output: asset and render manifests
      acceptance: Model/workflow/seed/hash and encoder are traceable.
    - id: P3-99
      title: Pass P3 acceptance gate
      depends_on:
      - P3-05
      output: reports/gates/P3_READY.json
      acceptance: p3 gate exits 0 with evidence.
  P4:
    name: Phase 4 advanced reference-video original re-creation
    tasks:
    - id: P4-01
      title: Implement advanced safe media ingestion and read-only copy
      depends_on:
      - P3-05
      output: src/reference_ingest/
      acceptance: Embedded text/QR/link cannot trigger commands.
    - id: P4-02
      title: Implement transcript, scene and keyframe analysis
      depends_on:
      - P4-01
      output: reference_report.json
      acceptance: Three test videos produce scene and timing data.
    - id: P4-03
      title: Implement style token extraction and rewrite modes
      depends_on:
      - P4-02
      output: reference_style.json and new storyboard
      acceptance: Generic style transfers without original audio or frames.
    - id: P4-04
      title: Implement originality and watermark checks
      depends_on:
      - P4-03
      output: copyright_checks in quality report
      acceptance: Seeded negative fixtures are blocked.
    - id: P4-99
      title: Pass P4 acceptance gate
      depends_on:
      - P4-04
      output: reports/gates/P4_READY.json
      acceptance: p4 gate exits 0 with evidence.
  P4.5:
    name: OpenMontage Sidecar Pilot
    optional: true
    depends_on:
    - P4
    tasks:
    - id: P4.5-01
      title: AGPL and dependency boundary review
      acceptance: No OpenMontage source copied into proprietary core.
    - id: P4.5-02
      title: Run capability envelope in isolated environment
      acceptance: Providers, costs and local tools are documented without production credentials.
    - id: P4.5-03
      title: Pilot one 30-second zero-key or free-footage project
      acceptance: Output is imported through the VideoFactory artifact and quality contracts.
    - id: P4.5-04
      title: Compare quality, latency, cost and reliability
      acceptance: Decision made whether to retain sidecar.
  P5:
    name: Optional Jianying draft
    tasks:
    - id: P5-01
      title: Verify installed Jianying version and choose one backend
      depends_on:
      - P4-04
      output: reports/JIANYING_COMPATIBILITY.md
      acceptance: Backend decision and limitations are recorded.
    - id: P5-02
      title: Create editable draft
      depends_on:
      - P5-01
      output: jianying_draft/
      acceptance: Draft opens and failure never changes MP4 job status.
    - id: P5-99
      title: Pass P5 acceptance gate
      depends_on:
      - P5-02
      output: reports/gates/P5_READY.json
      acceptance: p5 gate exits 0 with evidence.

  P1.5_COMPOSITION:
    name: Pink Pig Phase1.5 composition engine
    status: candidate_only
    does_not_imply_phase_pass: true
    depends_on:
    - P1
    tasks:
    - id: P1.5-01
      title: Add knowledge illustration composition contract and safe regions
      output: schemas/video/composition.schema.json
      acceptance: schema and semantic region validation pass.
    - id: P1.5-02
      title: Add Pink Pig quality gate and registry-backed knowledge assets
      output: video_factory/pipeline/pink_pig_quality.py
      acceptance: unregistered assets, missing style profile, and character mismatch fail closed.
    - id: P1.5-03
      title: Add subtitle layout engine and composition-aware renderer
      output: video_factory/pipeline/subtitle.py
      acceptance: captions stay in subtitle_area and content overlap fails before render.
    - id: P1.5-04
      title: Render and verify the four-scene Modbus composition demo
      output: dist/pink_pig_modbus_demo.mp4
      acceptance: MP4, audio, subtitles, ffprobe, and report agree.
    - id: P1.5-99
      title: Record Phase1.5 candidate report
      output: reports/PINK_PIG_FACTORY_PHASE1_5_COMPOSITION.md
      acceptance: READY is written only after every declared local gate passes; official P0/P1 remains unchanged.

  AI_DIRECTOR_PHASE2:
    name: AI Director staged local planning extension
    status: blocked_external_provider_acceptance
    does_not_imply_phase_pass: true
    depends_on:
    - P1.5_COMPOSITION
    tasks:
    - id: AI-DIRECTOR-01
      title: DirectorScript, factual brief, asset selection, quality, and Job State contracts
      output: schemas/video/director_script.schema.json
      acceptance: schema fixtures and fail-closed validation pass.
    - id: AI-DIRECTOR-02
      title: Deterministic ScriptPlanner, StoryboardAssembler, and Registry AssetSelector
      output: src/factory/director/script_planner.py
      acceptance: fake-provider generation is stable and never receives provider-selected asset IDs.
    - id: AI-DIRECTOR-03
      title: Integrate topic-file pipeline with existing run_job and local lifecycle snapshots
      output: generate_video.py
      acceptance: fake-provider full chain produces MP4/report; topic-only remains review_required.
    - id: AI-DIRECTOR-99
      title: Record Phase 2 candidate report
      output: reports/AI_DIRECTOR_PHASE2_IMPLEMENTATION.md
      acceptance: real Codex CLI evidence is recorded separately; READY only if all declared gates pass.
    remediation_004:
      status: local_remediated_pending_provider_recovery
      output: reports/AI_DIRECTOR_PHASE2_REMEDIATION_004.md
      acceptance: failed snapshots, stale-report protection, and legacy media-chain retirement pass local review
      does_not_imply_phase_pass: true
    provider_005:
      status: blocked_provider_cache_drift
      output: reports/AI_DIRECTOR_PHASE2_PROVIDER_QUALIFICATION_005.md
      acceptance: historical cache-drift evidence is preserved
      does_not_imply_phase_pass: true
    provider_005r:
      status: blocked_detached_worker_died
      output: reports/AI_DIRECTOR_PHASE2_PROVIDER_QUALIFICATION_005R.md
      acceptance: historical one-worker run remains immutable and must not be restarted
      does_not_imply_phase_pass: true
    provider_005s:
      status: blocked_detached_worker_died
      output: reports/AI_DIRECTOR_PHASE2_PROVIDER_QUALIFICATION_005S.md
      depends_on:
      - provider_005r
      acceptance: terminal historical evidence; do not restart or reuse
      does_not_imply_phase_pass: true
    provider_005t:
      status: blocked_detached_worker_died
      output: reports/AI_DIRECTOR_PHASE2_PROVIDER_QUALIFICATION_005T.md
      depends_on:
      - provider_005s
      acceptance: pre-ready state-contract failure preserved; no Worker, smoke, acceptance, cache move, or MP4
      does_not_imply_phase_pass: true
    worker_state_contract_005u:
      status: fail_review_marker_integration_unproven
      output: reports/AI_DIRECTOR_PHASE2_WORKER_STATE_CONTRACT_REMEDIATION_005U.md
      depends_on:
      - provider_005t
      acceptance: worker_started permits reservation PID zero, supervisor_ready requires persisted positive PID, launch fault matrix passes, BOM-safe schema validation passes, and independent final reviewer approves future qualification planning
      does_not_imply_real_provider_pass: true
      next: AI-DIRECTOR-PHASE2-REAL-PROVIDER-QUALIFICATION-005V
    worker_marker_integration_005u1:
      status: ready_for_external_read_only_audit
      output: reports/AI_DIRECTOR_PHASE2_WORKER_MARKER_INTEGRATION_REMEDIATION_005U1.md
      depends_on:
      - worker_state_contract_005u
      acceptance: exact production marker paths and production Supervisor/Worker integration must be proven by TestDrive failure matrix and success control
      does_not_imply_real_provider_pass: true
      next: independent external audit before any 005V planning
    legacy_chrome_host_baseline_005w:
      status: chrome_host_baseline_pass
      output: reports/AI_DIRECTOR_PHASE2_LEGACY_CHROME_HOST_BASELINE_005W.md
      depends_on:
      - provider_005v
      acceptance: one isolated contact-sheet target pass, one locked legacy run with 56 passed / 1 skipped / 13 subtests, raw evidence sanitized, provider_actions all zero
      does_not_imply_real_provider_pass: true
      next: fresh 005V local source-freeze and prelaunch review; no Provider execution authorization
    provider_005v_local_reentry_001:
      status: changes_required_preserved
      output: reports/AI_DIRECTOR_PHASE2_PROVIDER_LOCAL_GATE_REENTRY_005V.md
      depends_on:
      - legacy_chrome_host_baseline_005w
      acceptance: initial local re-entry tests passed but independent review found missing CR gate, non-unique 005T run binding, runtime asset freeze gap, and unsafe validation cleanup; do not run Provider
      next: provider_005v_local_gate_remediation_005v1
    provider_005v_local_gate_remediation_005v1:
      status: local_contract_remediated_final_approved
      output: reports/AI_DIRECTOR_PHASE2_PROVIDER_LOCAL_GATE_REMEDIATION_005V1.md
      depends_on:
      - provider_005v_local_reentry_001
      acceptance: CR dispatcher gate, exact 005T identity, 12 runtime asset hashes, safe validation cleanup, Pester 78, Director 47, Video 273, VideoFactory 5, legacy 56/1/13, two specialist approvals
      does_not_imply_real_provider_pass: true
      next: fresh_final_review_then_separate_005v_preflight_authorization
    provider_005v_preflight_005v2:
      status: preflight_blocked_unexpected_error
      output: reports/AI_DIRECTOR_PHASE2_PROVIDER_PREFLIGHT_005V2.md
      depends_on:
      - provider_005v_local_gate_remediation_005v1
      acceptance: exactly one read-only Preflight was attempted through a separate bridge CR; exit 1 with sanitized unexpected_error; no run root, lock, Worker, smoke, acceptance, cache mutation, or MP4
      does_not_imply_real_provider_pass: true
      next: new separately authorized preflight-diagnostics plan; do not retry 005V2 or enter 006
    provider_005v_preflight_observability_005v3:
      status: local_observability_remediated_pending_diagnostic_authorization
      output: reports/AI_DIRECTOR_PHASE2_PROVIDER_PREFLIGHT_OBSERVABILITY_REMEDIATION_005V3.md
      depends_on:
      - provider_005v_preflight_005v2
      acceptance: fixed preflight error schema, gate/substep/reason normalization, V3 diagnostic-only profile, 90 Pester passes, Director 47, Video 273, VideoFactory 5, legacy 005W baseline 56/1/13 plus current isolated non-Chrome subset 55/1/13, no operational execution; protected-file drift remains BASELINE_BLOCKED
      does_not_imply_real_provider_pass: true
      next: separately authorize exactly one read-only 005V3 diagnostic Preflight; do not start Worker or enter 006
    provider_005v_preflight_005v2:
      status: preflight_blocked_unexpected_error
      output: reports/AI_DIRECTOR_PHASE2_PROVIDER_PREFLIGHT_005V2.md
      depends_on:
      - provider_005v_local_gate_remediation_005v1
      acceptance: exactly one read-only Preflight was attempted through a separate bridge CR; exit 1 with sanitized unexpected_error; no run root, lock, Worker, smoke, acceptance, cache mutation, or MP4
      does_not_imply_real_provider_pass: true
      next: new separately authorized preflight-diagnostics plan; do not retry 005V2 or enter 006
