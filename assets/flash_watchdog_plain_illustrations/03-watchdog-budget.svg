<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
  <rect width="1672" height="941" fill="#ffffff"/>
  <style>.ink{font-family:'Microsoft YaHei',sans-serif;fill:#5A4650}.muted{font-family:'Microsoft YaHei',sans-serif;fill:#7b6870}.line{stroke:#5A4650;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none}</style>
  <text x="72" y="94" class="ink" font-size="48" font-weight="700">看门狗服务窗口 = 一笔可计算的预算</text>
  <text x="76" y="145" class="muted" font-size="26">独立低速时钟仍在倒计时，擦除最长时间不能靠猜</text>
  <rect x="120" y="265" width="1320" height="430" rx="30" fill="#F8FBFD" stroke="#B8CBD8" stroke-width="5"/>
  <text x="170" y="340" class="ink" font-size="32" font-weight="700">时间轴</text>
  <path d="M180 465H1340" class="line"/><path d="m1315 442 45 23-45 23" fill="#5A4650"/>
  <circle cx="220" cy="465" r="17" fill="#4E83B7"/><circle cx="720" cy="465" r="17" fill="#E4A65C"/><circle cx="1190" cy="465" r="17" fill="#C76B75"/>
  <text x="180" y="525" class="muted" font-size="28">开始</text><text x="665" y="525" class="muted" font-size="28">最长擦除时间</text><text x="1115" y="525" class="muted" font-size="28">超时 / 复位</text>
  <rect x="285" y="390" width="340" height="54" rx="20" fill="#D9EEF9"/><text x="360" y="427" class="ink" font-size="25">允许服务的窗口</text>
  <path d="M720 375v180" stroke="#E4A65C" stroke-width="8" stroke-dasharray="15 12"/>
  <path d="M1190 375v180" stroke="#C76B75" stroke-width="8" stroke-dasharray="15 12"/>
  <rect x="180" y="585" width="1120" height="55" rx="20" fill="#FFF5E7"/><text x="245" y="622" class="ink" font-size="27">预算 = 最长擦除时间 + 允许的响应延迟 + 手册规定的服务条件</text>
</svg>
