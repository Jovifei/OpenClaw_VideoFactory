<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
<rect width="1672" height="941" fill="#FFFFFF"/><style>.ink{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#344054}.muted{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#667085}</style>
<text x="72" y="92" class="ink" font-size="48" font-weight="700">FreeRTOS Mutex / ISR 边界检查表</text><text x="76" y="143" class="muted" font-size="26">先判断“当前是不是 ISR”，再选择同步原语和共享资源访问路径</text>
<rect x="110" y="215" width="1450" height="570" rx="30" fill="#F9FAFB" stroke="#D0D5DD" stroke-width="5"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#344054" font-size="31"><circle cx="185" cy="300" r="25" fill="#3A9B6D"/><text x="176" y="311" fill="#fff" font-size="24" font-weight="700">1</text><text x="235" y="311">Mutex 的所有权取得与释放，只放在任务上下文。</text><circle cx="185" cy="395" r="25" fill="#3A9B6D"/><text x="176" y="406" fill="#fff" font-size="24" font-weight="700">2</text><text x="235" y="406">ISR 不等待 Mutex，也不进入可能阻塞的路径。</text><circle cx="185" cy="490" r="25" fill="#3A9B6D"/><text x="176" y="501" fill="#fff" font-size="24" font-weight="700">3</text><text x="235" y="501">ISR 用 FromISR 通知 / 队列 / 信号量原语把工作交给任务。</text><circle cx="185" cy="585" r="25" fill="#3A9B6D"/><text x="176" y="596" fill="#fff" font-size="24" font-weight="700">4</text><text x="235" y="596">优先级继承解决任务持锁的优先级反转，不是 ISR 信号机制。</text><circle cx="185" cy="680" r="25" fill="#3A9B6D"/><text x="176" y="691" fill="#fff" font-size="24" font-weight="700">5</text><text x="235" y="691">ISR 取数、清标志、通知后尽快退出；共享状态留给任务。</text></g>
</svg>