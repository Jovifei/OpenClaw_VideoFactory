<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
<rect width="1672" height="941" fill="#FFFFFF"/><style>.ink{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#344054}.muted{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#667085}.white{font-family:"Noto Sans CJK SC",sans-serif;fill:#fff;font-weight:700}.line{stroke:#344054;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none}</style>
<text x="72" y="92" class="ink" font-size="48" font-weight="700">优先级继承：发生在任务持锁关系里</text><text x="76" y="143" class="muted" font-size="26">高优先级任务等待时，持锁任务可临时继承优先级，尽快释放 Mutex</text>
<text x="105" y="240" class="ink" font-size="31" font-weight="700">时间 →</text><rect x="210" y="290" width="1160" height="82" rx="18" fill="#EAF2FF"/><text x="90" y="345" class="ink" font-size="28">高优先级任务 H</text><rect x="210" y="430" width="1160" height="82" rx="18" fill="#F2F4F7"/><text x="90" y="485" class="ink" font-size="28">低优先级任务 L</text>
<rect x="310" y="441" width="470" height="60" rx="14" fill="#667085"/><text x="425" y="482" class="white" font-size="25">L 持有 Mutex</text><rect x="620" y="300" width="290" height="60" rx="14" fill="#D92D20"/><text x="690" y="341" class="white" font-size="25">H 等待 Mutex</text><path d="M780 471V395" class="line"/><path d="m756 418 24-40 24 40" fill="#344054"/><rect x="805" y="441" width="420" height="60" rx="14" fill="#3A9B6D"/><text x="845" y="482" class="white" font-size="25">L 临时继承更高优先级</text><path d="M1225 471h105" class="line"/><path d="m1308 448 40 23-40 23" fill="#344054"/><rect x="1325" y="300" width="230" height="60" rx="14" fill="#5677B9"/><text x="1360" y="341" class="white" font-size="25">H 获得 Mutex</text>
<rect x="240" y="650" width="1190" height="115" rx="24" fill="#FFF9EB" stroke="#EAAA08" stroke-width="5"/><text x="290" y="720" class="ink" font-size="30">优先级继承解决的是“任务持锁导致高优先级任务被反转”的问题，不是 ISR 信号机制。</text>
</svg>