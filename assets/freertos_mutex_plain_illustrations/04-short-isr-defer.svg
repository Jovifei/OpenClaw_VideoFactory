<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
<rect width="1672" height="941" fill="#FFFFFF"/><style>.ink{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#344054}.muted{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#667085}.white{font-family:"Noto Sans CJK SC",sans-serif;fill:#fff;font-weight:700}.line{stroke:#344054;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none}</style>
<text x="72" y="92" class="ink" font-size="48" font-weight="700">短 ISR + 任务延后处理</text><text x="76" y="143" class="muted" font-size="26">把共享资源和状态机修改从中断上下文移到任务上下文</text>
<rect x="100" y="225" width="1470" height="135" rx="25" fill="#FFF4ED" stroke="#E07941" stroke-width="6"/><text x="145" y="282" class="ink" font-size="34" font-weight="700">ISR：越短越好</text><text x="145" y="330" class="muted" font-size="27">① 读取必要数据　② 清中断标志　③ 通知任务　④ 退出</text><path d="M835 380v105" class="line"/><path d="m812 463 23 40 23-40" fill="#344054"/>
<rect x="100" y="510" width="1470" height="210" rx="28" fill="#EEF4FF" stroke="#5677B9" stroke-width="6"/><text x="145" y="570" class="ink" font-size="34" font-weight="700">Worker Task：把“重工作”放这里</text><text x="145" y="622" class="muted" font-size="28">Mutex 保护的共享资源 · 状态机修改 · 日志整理 · 较长计算</text><rect x="145" y="650" width="360" height="44" rx="10" fill="#5677B9"/><text x="200" y="681" class="white" font-size="23">可调度 · 可阻塞 · 可恢复</text><rect x="660" y="650" width="360" height="44" rx="10" fill="#5677B9"/><text x="715" y="681" class="white" font-size="23">共享状态集中处理</text><rect x="1175" y="650" width="300" height="44" rx="10" fill="#5677B9"/><text x="1215" y="681" class="white" font-size="23">减少中断抖动</text><text x="205" y="815" class="ink" font-size="31" font-weight="700">原则：ISR 只负责“发生了什么”，任务负责“接下来怎么办”。</text>
</svg>