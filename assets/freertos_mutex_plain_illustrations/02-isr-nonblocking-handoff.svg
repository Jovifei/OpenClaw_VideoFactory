<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941">
<rect width="1672" height="941" fill="#FFFFFF"/><style>.ink{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#344054}.muted{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#667085}.white{font-family:"Noto Sans CJK SC",sans-serif;fill:#fff;font-weight:700}.line{stroke:#344054;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none}</style>
<text x="72" y="92" class="ink" font-size="48" font-weight="700">ISR 不阻塞：用 FromISR 原语交棒</text><text x="76" y="143" class="muted" font-size="26">中断负责快速通知，任务负责可能需要互斥和状态推进的工作</text>
<rect x="90" y="235" width="310" height="190" rx="28" fill="#FFF4ED" stroke="#E07941" stroke-width="6"/><text x="185" y="300" class="ink" font-size="34" font-weight="700">IRQ / ISR</text><text x="132" y="353" class="muted" font-size="26">取数 · 清标志</text>
<rect x="520" y="235" width="450" height="190" rx="28" fill="#EEF4FF" stroke="#5677B9" stroke-width="6"/><text x="575" y="300" class="ink" font-size="32" font-weight="700">ISR-safe 通知</text><text x="575" y="353" class="muted" font-size="25">xTaskNotifyFromISR / QueueFromISR</text>
<rect x="1090" y="235" width="460" height="190" rx="28" fill="#ECFDF3" stroke="#3A9B6D" stroke-width="6"/><text x="1152" y="300" class="ink" font-size="34" font-weight="700">处理任务</text><text x="1152" y="353" class="muted" font-size="26">再进入 Mutex / 状态机</text>
<path d="M400 330h110" class="line"/><path d="m489 307 40 23-40 23" fill="#344054"/><path d="M970 330h110" class="line"/><path d="m1059 307 40 23-40 23" fill="#344054"/>
<rect x="170" y="575" width="1330" height="145" rx="26" fill="#F9FAFB" stroke="#D0D5DD" stroke-width="5"/><text x="235" y="633" class="ink" font-size="31" font-weight="700">ISR 只做“不等待”的事：</text><text x="610" y="633" class="muted" font-size="29">采样 / 清标志 / 发送通知 / 必要时请求切换任务</text><text x="235" y="685" class="ink" font-size="31" font-weight="700">共享资源操作：</text><text x="610" y="685" class="muted" font-size="29">交给被唤醒的任务完成</text>
</svg>