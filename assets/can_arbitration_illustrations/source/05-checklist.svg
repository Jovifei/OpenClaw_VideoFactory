<text x="98" y="175" font-family="Arial" font-size="28" fill="#5C677D">A reproducible five-step explanation</text>

<text x="270" y="250" font-family="Arial" font-size="38" fill="#16324F">dominant beats recessive</text>
<text x="270" y="340" font-family="Arial" font-size="38" fill="#16324F">nodes compare identifier bits</text>
<text x="270" y="430" font-family="Arial" font-size="38" fill="#16324F">recessive + dominant = loss</text>
