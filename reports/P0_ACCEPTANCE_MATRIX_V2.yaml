schema_version: '2.0'
status: implemented_pending_evidence
owner: Jovi
phase_state_rule:
  current_project_status: P0_not_started
  p0_ready_requires: all_required_rows_passed_and_gate_exit_zero
  status_update: scripts/91_update_project_status.py_only
  prohibited_shortcuts:
    - manual_feishu_replay
    - ack_fault_injection
    - second_event_consumer
    - bot_loopback_as_user_ingress
    - fabricated_event_or_message_id
required_rows:
  - id: single_consumer
    evidence_file: P0_V2_SINGLE_CONSUMER_EVIDENCE.json
    evidence_class: static_topology
    allowed_evidence_classes: [static_topology]
    required_assertions: [unique_video_factory_binding, no_analyzer_binding, no_second_event_consumer]
    gate: blocking
  - id: real_message_entry
    evidence_file: P0_V2_REAL_MESSAGE_ENTRY_EVIDENCE.json
    evidence_class: real_feishu
    allowed_evidence_classes: [real_feishu]
    required_assertions: [ordinary_user_text, txt_ingress, png_ingress, wav_ingress, mp4_ingress, single_video_factory_route, single_visible_reply]
    gate: blocking
  - id: event_id_idempotency
    evidence_file: P0_EVENT_IDEMPOTENCY_V2.json
    evidence_class: integration
    allowed_evidence_classes: [integration]
    required_assertions: [first_event_persisted_once, second_event_ignored, event_ledger_survives_restart]
    gate: blocking
  - id: duplicate_event_protection
    evidence_file: P0_DUPLICATE_EFFECT_PROTECTION_V2.json
    evidence_class: integration
    allowed_evidence_classes: [integration]
    required_assertions: [no_duplicate_ingress, no_duplicate_analysis_request, no_duplicate_delivery]
    gate: blocking
  - id: safe_media_ingress
    evidence_file: P0_V2_SAFE_MEDIA_INGRESS.json
    evidence_class: real_feishu_plus_regression
    allowed_evidence_classes: [real_feishu_plus_regression]
    required_assertions: [txt_receipt_quarantine_sha, png_receipt_quarantine_sha, wav_receipt_quarantine_sha, mp4_receipt_quarantine_sha, trusted_root_toctou]
    gate: blocking
  - id: image_analysis
    evidence_file: P0_V2_IMAGE_ANALYSIS.json
    evidence_class: real_feishu_historical_compatible
    allowed_evidence_classes: [real_feishu_historical_compatible, real_feishu]
    required_assertions: [explicit_ticket_intent, mimo_v2_5_analysis, single_classified_result]
    gate: blocking
  - id: audio_analysis
    evidence_file: P0_V2_AUDIO_ANALYSIS.json
    evidence_class: real_feishu_historical_compatible
    allowed_evidence_classes: [real_feishu_historical_compatible, real_feishu]
    required_assertions: [explicit_ticket_intent, faster_whisper_cuda, classified_transcript_result]
    gate: blocking
  - id: video_analysis
    evidence_file: P0_V2_VIDEO_ANALYSIS.json
    evidence_class: real_feishu_historical_compatible
    allowed_evidence_classes: [real_feishu_historical_compatible, real_feishu]
    required_assertions: [explicit_ticket_intent, ffprobe_and_frame_sampling, whisper_and_vision_classified]
    gate: blocking
  - id: restart_recovery
    evidence_file: P0_RESTART_RECOVERY_V2.json
    evidence_class: real_feishu
    allowed_evidence_classes: [real_feishu]
    required_assertions: [managed_restart_completed, topology_preserved, fresh_event_single_route_reply]
    gate: blocking
non_blocking_observations:
  - id: platform_retry_observation
    status_if_absent: NOT_PROVEN_PLATFORM_RETRY
    rationale: Feishu automatic retry is platform-controlled; manual replay is not a P0 test method.
required_outputs:
  - reports/gates/P0_READY.json
  - reports/gates/P0_FAILED.json
