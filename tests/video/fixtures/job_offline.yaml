# Offline fallback evidence job — QA (T05).
#
# Purpose: prove that `allow_network: false` still produces an MP4 through the
# level-2 (bgm) audio fallback, WITHOUT overwriting the main-chain evidence in
# `dist/story_demo/`.
#
# The main chain (examples/pink_pig_story_demo/job.yaml) writes to
#   dist/story_demo/        + dist/pink_pig_story_demo.mp4
# this job writes to a completely separate pair
#   dist/story_demo_offline/ + dist/pink_pig_story_demo_offline.mp4
#
# It must live inside the repository: `storyboard_ref` is resolved relative to
# this file's directory and the pipeline rejects out-of-repo job files
# (`job_missing`).
#
# Usage:
#   <envs/default python> generate_video.py --job tests/video/fixtures/job_offline.yaml

schema_version: "1.0"
job_id: pink_pig_story_demo_offline
job_kind: video_render
storyboard_ref: ../../../examples/pink_pig_story_demo/storyboard.json
registry_ref: src/factory/assets/pink_pig/registry.json

render:
  width: 1080
  height: 1920
  fps: 30
  transition_seconds: 0.4
  pad_color: "0xF7E4EA"

audio:
  strategy: tts_with_offline_fallback
  allow_network: false
  fallback_bgm: assets/pink_pig/demo_music.wav

subtitle:
  enabled: true
  source: scene_caption

outputs:
  video: dist/pink_pig_story_demo_offline.mp4
  work_dir: dist/story_demo_offline
